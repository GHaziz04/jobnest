<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Voice - JobNest</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 80px;
            background: #F5F7FB;
        }
        h2 { color: #1E3A5F; }
        #status {
            font-size: 16px;
            margin: 20px;
            color: #64748B;
            min-height: 30px;
        }
        button {
            font-size: 18px;
            padding: 14px 30px;
            background: #7C3AED;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        button:hover { background: #6D28D9; }
    </style>
</head>
<body>
<h2>🎤 Reconnaissance Vocale - JobNest</h2>
<p id="status">Cliquez pour parler...</p>
<button onclick="start()">🎙️ Commencer</button>

<script>
    function start() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            document.getElementById('status').innerText = '❌ Utilisez Chrome.';
            return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = "fr-FR";
        recognition.continuous = false;
        recognition.interimResults = false;

        document.getElementById('status').innerText = '🎤 Écoute en cours...';

        recognition.onresult = function(event) {
            let text = event.results[0][0].transcript;
            document.getElementById('status').innerText = '✅ Reconnu : ' + text;
            fetch("http://localhost:5555/voice", {
                method: "POST",
                headers: { "Content-Type": "text/plain; charset=utf-8" },
                body: text
            })
                .then(() => {
                    document.getElementById('status').innerText = '✅ Envoyé : ' + text;
                })
                .catch(err => {
                    document.getElementById('status').innerText = '❌ Erreur : ' + err;
                });
        };

        recognition.onerror = function(event) {
            document.getElementById('status').innerText = '❌ Erreur micro : ' + event.error;
        };

        recognition.start();
    }
</script>
</body>
</html>
