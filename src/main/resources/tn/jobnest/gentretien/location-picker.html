<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <title>Choisir un lieu</title>
    <style>
        /* ═══ LEAFLET CSS EMBARQUÉ ═══ */

nter-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-control{float:left;clear:both}.leaflet-right .leaflet-control{float:right}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}.leaflet-fade-anim .leaflet-popup{opacity:0;-webkit-transition:opacity .2s linear;-moz-transition:opacity .2s linear;transition:opacity .2s linear}.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}.leaflet-zoom-animated{-webkit-transform-origin:0 0;-ms-transform-origin:0 0;transform-origin:0 0}.leaflet-zoom-anim .leaflet-zoom-animated{will-change:transform}.leaflet-zoom-anim .leaflet-zoom-animated{-webkit-transition:-webkit-transform .25s cubic-bezier(0,0,.25,1);-moz-transition:-moz-transform .25s cubic-bezier(0,0,.25,1);transition:transform .25s cubic-bezier(0,0,.25,1)}.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{-webkit-transition:none;-moz-transition:none;transition:none}.leaflet-zoom-anim .leaflet-zoom-animated.leaflet-zoom-hide{visibility:hidden}.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:-webkit-grab;cursor:-moz-grab;cursor:grab}.leaflet-crosshair,.leaflet-crosshair .leaflet-interactive{cursor:crosshair}.leaflet-popup-pane,.leaflet-control{cursor:auto}.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive,.leaflet-dragging .leaflet-marker-draggable{cursor:move;cursor:-webkit-grabbing;cursor:-moz-grabbing;cursor:grabbing}.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive,svg.leaflet-image-layer.leaflet-interactive path{pointer-events:visiblePainted;pointer-events:auto}.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#fff;color:#333;box-shadow:0 3px 14px rgba(0,0,0,.4)}.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:12px}.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none;display:none}.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;-webkit-transform:rotate(45deg);-moz-transform:rotate(45deg);-ms-transform:rotate(45deg);transform:rotate(45deg)}.leaflet-popup-content{margin:13px 24px 13px 20px;line-height:1.3;font-size:13px}.leaflet-popup-content p{margin:17px 0 0}.leaflet-popup-close-button{position:absolute;top:0;right:0;border:none;text-align:center;width:24px;height:24px;font:16px/24px Tahoma,Verdana,sans-serif;color:#757575;text-decoration:none;background:transparent}.leaflet-popup-close-button:hover,.leaflet-popup-close-button:focus{color:#585858}.leaflet-popup-scrolled{overflow:auto}.leaflet-container{background:#ddd;outline-offset:1px}.leaflet-container .leaflet-control-attribution{background:rgba(255,255,255,.8);margin:0}.leaflet-control-attribution,.leaflet-control-scale-line{padding:0 5px;color:#333;font-size:11px}.leaflet-left .leaflet-control-scale{margin-left:5px}.leaflet-bottom .leaflet-control-scale{margin-bottom:5px}.leaflet-control-scale-line{border:2px solid #777;border-top:none;line-height:1.1;padding:2px 5px 1px;font-size:11px;white-space:nowrap;overflow:hidden;-moz-box-sizing:border-box;box-sizing:border-box;background:rgba(255,255,255,.8)}.leaflet-control-zoom,.leaflet-control-layers{position:relative;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.65);border-radius:4px}.leaflet-control-zoom a{width:26px;height:26px;line-height:26px;display:block;text-align:center;text-decoration:none;color:#444}.leaflet-control-zoom a{font:bold 18px 'Lucida Console',Monaco,monospace}.leaflet-control-zoom-out{font:bold 20px 'Lucida Console',Monaco,monospace}.leaflet-control-zoom a:hover,.leaflet-control-zoom a:focus{background-color:#f4f4f4;color:#1a1a1a}.leaflet-control-zoom-in{border-bottom:1px solid #ccc}.leaflet-touch .leaflet-control-zoom{border:2px solid rgba(0,0,0,.2)}

        /* ═══ APP STYLES ═══ */
        :root {
            --navy: #0F2444;
            --blue: #1A6BFF;
            --blue2: #0E54CC;
            --green: #00C37A;
            --green2: #00A566;
            --red: #FF3B5C;
            --slate: #64748B;
            --light: #F0F4FF;
            --border: #DDE5F4;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: var(--light);
            display: flex; flex-direction: column;
        }

        /* ── BARRE DE RECHERCHE ── */
        #searchbar {
            flex: 0 0 auto;
            display: flex; align-items: center; gap: 8px;
            padding: 10px 14px;
            background: #fff;
            border-bottom: 1.5px solid var(--border);
            box-shadow: 0 2px 10px rgba(15,36,68,.07);
            z-index: 1000;
        }
        #sw { flex: 1; position: relative; }
        #si {
            position: absolute; left: 10px; top: 50%;
            transform: translateY(-50%); pointer-events: none;
        }
        #search-input {
            width: 100%; padding: 9px 12px 9px 32px;
            border: 1.5px solid var(--border); border-radius: 11px;
            font-size: 13px; color: var(--navy);
            background: var(--light); outline: none;
            font-family: inherit; transition: border-color .2s;
        }
        #search-input:focus { border-color: var(--blue); background: #fff; }
        .btn-search {
            display: flex; align-items: center; gap: 6px;
            padding: 9px 16px; border: none; border-radius: 11px;
            font-size: 13px; font-weight: 700; cursor: pointer;
            font-family: inherit; transition: opacity .18s, transform .12s;
            background: linear-gradient(135deg, var(--blue), var(--blue2));
            color: #fff; box-shadow: 0 3px 12px rgba(26,107,255,.3);
            white-space: nowrap;
        }
        .btn-search:hover { opacity: .88; transform: translateY(-1px); }
        .btn-search:active { transform: scale(.97); }

        /* ── CARTE ── */
        #mw { flex: 1 1 auto; position: relative; min-height: 0; overflow: hidden; }
        #map {
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            right: 0 !important; bottom: 0 !important;
            width: 100% !important; height: 100% !important;
        }

        /* ── BARRE D'ADRESSE SÉLECTIONNÉE (bas) ── */
        #addrbar {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: #fff;
            border-top: 1.5px solid var(--border);
            box-shadow: 0 -4px 20px rgba(15,36,68,.1);
            padding: 12px 16px;
            display: flex; align-items: center; gap: 10px;
            z-index: 900;
            transform: translateY(100%);
            transition: transform .3s cubic-bezier(.34,1.3,.64,1);
        }
        #addrbar.on { transform: translateY(0); }
        #addr-icon {
            width: 36px; height: 36px; flex-shrink: 0;
            background: linear-gradient(135deg, var(--blue), var(--blue2));
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        #addr-text {
            flex: 1; min-width: 0;
        }
        #addr-label {
            font-size: 10px; font-weight: 700; color: var(--slate);
            text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px;
        }
        #addr-value {
            font-size: 13px; font-weight: 700; color: var(--navy);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #btn-valider {
            flex-shrink: 0;
            display: flex; align-items: center; gap: 7px;
            padding: 10px 18px; border: none; border-radius: 11px;
            font-size: 13px; font-weight: 800; cursor: pointer;
            font-family: inherit;
            background: linear-gradient(135deg, var(--green), var(--green2));
            color: #fff; box-shadow: 0 3px 14px rgba(0,195,122,.35);
            transition: opacity .18s, transform .12s;
        }
        #btn-valider:hover { opacity: .88; transform: translateY(-1px); }
        #btn-valider:active { transform: scale(.97); }

        /* ── HINT CENTRAL ── */
        #hint {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15,36,68,.82);
            color: #fff; border-radius: 14px;
            padding: 14px 22px; font-size: 13px; font-weight: 600;
            z-index: 800; pointer-events: none;
            text-align: center; max-width: 280px;
            box-shadow: 0 6px 24px rgba(0,0,0,.3);
            transition: opacity .4s;
        }
        #hint.h { opacity: 0; }

        /* ── OVERLAY CHARGEMENT ── */
        #ov {
            position: absolute; inset: 0;
            background: rgba(240,244,255,.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
        }
        #ov.h { display: none; }
        .lc {
            background: #fff; border-radius: 14px;
            box-shadow: 0 8px 28px rgba(15,36,68,.13);
            padding: 18px 28px; display: flex; align-items: center;
            gap: 12px; font-size: 13px; font-weight: 700; color: var(--navy);
        }
        .sp {
            width: 20px; height: 20px;
            border: 3px solid var(--border); border-top-color: var(--blue);
            border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── SUGGESTIONS AUTOCOMPLETE ── */
        #suggestions {
            position: absolute; top: 100%; left: 0; right: 0;
            background: #fff; border: 1.5px solid var(--border);
            border-top: none; border-radius: 0 0 12px 12px;
            box-shadow: 0 8px 20px rgba(15,36,68,.12);
            z-index: 2000; max-height: 220px; overflow-y: auto;
            display: none;
        }
        #suggestions.on { display: block; }
        .sug-item {
            padding: 10px 14px; cursor: pointer;
            font-size: 12.5px; color: var(--navy);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: flex-start; gap: 10px;
            transition: background .15s;
        }
        .sug-item:last-child { border-bottom: none; }
        .sug-item:hover { background: var(--light); }
        .sug-icon { flex-shrink: 0; margin-top: 1px; }
        .sug-main { font-weight: 700; }
        .sug-sub { font-size: 11px; color: var(--slate); margin-top: 1px; }

        /* ZOOM */
        .leaflet-control-zoom a {
            border-radius: 9px !important;
            border: 1.5px solid var(--border) !important;
            color: var(--navy) !important;
            font-weight: 800 !important;
        }
        .leaflet-control-zoom { border: none !important; }

        /* POPUP */
        .leaflet-popup-content-wrapper {
            border-radius: 13px !important;
            box-shadow: 0 7px 25px rgba(15,36,68,.15) !important;
        }
        .leaflet-popup-content { margin: 0 !important; min-width: 160px; }
        .ppop { padding: 11px 15px; }
        .ppop-title { font-weight: 800; font-size: 12px; color: var(--navy); margin-bottom: 3px; }
        .ppop-addr { font-size: 11px; color: var(--slate); line-height: 1.4; }
    </style>
</head>
<body>

<!-- BARRE DE RECHERCHE -->
<div id="searchbar">
    <div id="sw" style="position:relative;">
        <span id="si">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="#1A6BFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </span>
        <input type="text" id="search-input"
               placeholder="Rechercher une adresse ou un lieu..."
               autocomplete="off"/>
        <div id="suggestions"></div>
    </div>
    <button class="btn-search" onclick="doSearch()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Chercher
    </button>
</div>

<!-- CARTE -->
<div id="mw">
    <div id="map"></div>

    <!-- HINT -->
    <div id="hint">
        Cliquez sur la carte pour s&eacute;lectionner un lieu<br/>
        <span style="font-size:11px;opacity:.75;font-weight:400;">
            ou utilisez la barre de recherche ci-dessus
        </span>
    </div>

    <!-- OVERLAY CHARGEMENT -->
    <div id="ov">
        <div class="lc">
            <div class="sp"></div>
            <span id="omsg">Chargement de la carte&hellip;</span>
        </div>
    </div>

    <!-- BARRE ADRESSE SÉLECTIONNÉE -->
    <div id="addrbar">
        <div id="addr-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="10" r="3"/>
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            </svg>
        </div>
        <div id="addr-text">
            <div id="addr-label">Adresse s&eacute;lectionn&eacute;e</div>
            <div id="addr-value">--</div>
        </div>
        <button id="btn-valider" onclick="validerAdresse()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
            Valider ce lieu
        </button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    /* ════════════════════════════════════════════════
       VARIABLES GLOBALES
    ════════════════════════════════════════════════ */
    var map = null;
    var marker = null;
    var selectedAddr = '';
    var selectedLat = null;
    var selectedLng = null;
    var searchTimer = null;
    var ready = false;

    /* Icône marqueur sélection */
    var iSel = L.divIcon({
        className: '',
        html: '<div style="width:40px;height:40px;display:flex;align-items:flex-end;justify-content:center;">'
            + '<div style="width:34px;height:34px;'
            + 'background:linear-gradient(135deg,#0F2444,#1A6BFF);'
            + 'border-radius:50% 50% 50% 0;transform:rotate(-45deg);'
            + 'border:3px solid #fff;box-shadow:0 6px 18px rgba(26,107,255,.5);'
            + 'display:flex;align-items:center;justify-content:center;">'
            + '<svg style="transform:rotate(45deg);" width="15" height="15" viewBox="0 0 24 24"'
            + ' fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'
            + '<circle cx="12" cy="10" r="3"/>'
            + '<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>'
            + '</svg></div></div>',
        iconSize: [40, 40], iconAnchor: [20, 40], popupAnchor: [0, -44]
    });

    /* ════════════════════════════════════════════════
       INIT CARTE
    ════════════════════════════════════════════════ */
    function initMap() {
        map = L.map('map', {
            zoomControl: true,
            fadeAnimation: false,
            zoomAnimation: false,
            markerZoomAnimation: false
        }).setView([36.8189, 10.1658], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            maxZoom: 19
        }).addTo(map);

        /* Séquence invalidateSize pour JavaFX WebView */
        function rs() { map.invalidateSize({ animate: false, pan: false }); }
        rs();
        [50, 100, 200, 400, 700, 1000, 1500, 2500].forEach(function(d) {
            setTimeout(rs, d);
        });
        window.addEventListener('resize', function() { rs(); setTimeout(rs, 100); });
        if (window.ResizeObserver) {
            new ResizeObserver(function() { rs(); setTimeout(rs, 80); })
                .observe(document.getElementById('mw'));
        }

        ready = true;
        hideOv();

        /* CLIC SUR LA CARTE → sélection de position */
        map.on('click', function(e) {
            var lat = e.latlng.lat, lng = e.latlng.lng;
            showOv('R\u00e9cup\u00e9ration de l\'adresse\u2026');
            reverseGeocode(lat, lng);
        });
    }

    /* ════════════════════════════════════════════════
       REVERSE GEOCODING (clic carte → adresse texte)
    ════════════════════════════════════════════════ */
    function reverseGeocode(lat, lng) {
        fetch('https://nominatim.openstreetmap.org/reverse?lat=' + lat
            + '&lon=' + lng + '&format=json&accept-language=fr')
            .then(function(r) { return r.json(); })
            .then(function(d) {
                hideOv();
                var addr = d.display_name || (lat.toFixed(5) + ', ' + lng.toFixed(5));
                /* On formate une adresse plus courte si possible */
                if (d.address) {
                    var parts = [];
                    if (d.address.road)          parts.push(d.address.road);
                    if (d.address.house_number)  parts.push(d.address.house_number);
                    if (d.address.suburb)        parts.push(d.address.suburb);
                    if (d.address.city || d.address.town || d.address.village)
                        parts.push(d.address.city || d.address.town || d.address.village);
                    if (d.address.country)       parts.push(d.address.country);
                    if (parts.length > 0) addr = parts.join(', ');
                }
                placeMarker(lat, lng, addr);
            })
            .catch(function() {
                hideOv();
                var addr = lat.toFixed(5) + ', ' + lng.toFixed(5);
                placeMarker(lat, lng, addr);
            });
    }

    /* ════════════════════════════════════════════════
       PLACE LE MARQUEUR ET MET À JOUR LA BARRE
    ════════════════════════════════════════════════ */
    function placeMarker(lat, lng, addr) {
        if (marker) map.removeLayer(marker);
        selectedLat = lat;
        selectedLng = lng;
        selectedAddr = addr;

        marker = L.marker([lat, lng], { icon: iSel }).addTo(map)
            .bindPopup(
                '<div class="ppop">'
                + '<div class="ppop-title">Lieu s\u00e9lectionn\u00e9</div>'
                + '<div class="ppop-addr">' + esc(addr) + '</div>'
                + '</div>'
            )
            .openPopup();

        /* Mettre à jour la barre basse */
        document.getElementById('addr-value').textContent = addr;
        document.getElementById('addrbar').classList.add('on');

        /* Masquer le hint */
        document.getElementById('hint').classList.add('h');
    }

    /* ════════════════════════════════════════════════
       RECHERCHE D'ADRESSE (bouton Chercher)
    ════════════════════════════════════════════════ */
    function doSearch() {
        var q = document.getElementById('search-input').value.trim();
        if (!q) return;
        hideSuggestions();
        showOv('Recherche en cours\u2026');
        fetch('https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(q)
            + '&format=json&limit=1&accept-language=fr')
            .then(function(r) { return r.json(); })
            .then(function(d) {
                hideOv();
                if (d && d.length > 0) {
                    var lat = parseFloat(d[0].lat), lng = parseFloat(d[0].lon);
                    var addr = d[0].display_name;
                    map.setView([lat, lng], 16);
                    setTimeout(function() { map.invalidateSize({ animate: false }); }, 200);
                    placeMarker(lat, lng, addr);
                } else {
                    alert('Adresse introuvable. Essayez une autre formulation.');
                }
            })
            .catch(function() { hideOv(); alert('Erreur lors de la recherche.'); });
    }

    /* ════════════════════════════════════════════════
       AUTOCOMPLETE — suggestions pendant la frappe
    ════════════════════════════════════════════════ */
    document.getElementById('search-input').addEventListener('input', function() {
        clearTimeout(searchTimer);
        var q = this.value.trim();
        if (q.length < 3) { hideSuggestions(); return; }
        searchTimer = setTimeout(function() {
            fetch('https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(q)
                + '&format=json&limit=5&accept-language=fr')
                .then(function(r) { return r.json(); })
                .then(function(d) { showSuggestions(d); })
                .catch(function() {});
        }, 350);
    });

    document.getElementById('search-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') doSearch();
    });

    function showSuggestions(results) {
        var box = document.getElementById('suggestions');
        box.innerHTML = '';
        if (!results || results.length === 0) { hideSuggestions(); return; }
        results.forEach(function(r) {
            var parts = r.display_name.split(', ');
            var main = parts[0] || r.display_name;
            var sub  = parts.slice(1, 3).join(', ');
            var item = document.createElement('div');
            item.className = 'sug-item';
            item.innerHTML = '<div class="sug-icon">'
                + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1A6BFF"'
                + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
                + '<circle cx="12" cy="10" r="3"/>'
                + '<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>'
                + '</svg></div>'
                + '<div><div class="sug-main">' + esc(main) + '</div>'
                + '<div class="sug-sub">' + esc(sub) + '</div></div>';
            (function(result) {
                item.addEventListener('click', function() {
                    document.getElementById('search-input').value = result.display_name;
                    hideSuggestions();
                    var lat = parseFloat(result.lat), lng = parseFloat(result.lon);
                    map.setView([lat, lng], 16);
                    setTimeout(function() { map.invalidateSize({ animate: false }); }, 200);
                    placeMarker(lat, lng, result.display_name);
                });
            })(r);
            box.appendChild(item);
        });
        box.classList.add('on');
    }

    function hideSuggestions() {
        document.getElementById('suggestions').classList.remove('on');
    }

    /* Fermer suggestions au clic ailleurs */
    document.addEventListener('click', function(e) {
        if (!document.getElementById('sw').contains(e.target)) {
            hideSuggestions();
        }
    });

    /* ════════════════════════════════════════════════
       VALIDER L'ADRESSE
       → Appelle la fonction Java via window.adresseValidee
         qui est injectée par LocationPickerController
    ════════════════════════════════════════════════ */
    function validerAdresse() {
        if (!selectedAddr) return;
        /* ─── INTERFACE VERS JAVA ───
           LocationPickerController.java récupère cette valeur
           via webEngine.executeScript("getSelectedAddress()")
           APRÈS que l'utilisateur a cliqué sur "Valider ce lieu"
        */
        try {
            /* Signaler à Java que la sélection est confirmée */
            if (typeof window.javaCallback !== 'undefined') {
                window.javaCallback.onAddressSelected(
                    selectedAddr,
                    String(selectedLat),
                    String(selectedLng)
                );
            }
        } catch(e) {}

        /* Stocker dans une variable globale accessible par executeScript */
        window._selectedAddress = selectedAddr;
        window._selectedLat     = selectedLat;
        window._selectedLng     = selectedLng;
        window._confirmed       = true;

        /* Signal Java via un changement de titre (méthode fiable JavaFX WebView) */
        document.title = 'CONFIRMED:' + selectedAddr;
    }

    /* Fonctions appelables depuis Java via executeScript */
    function getSelectedAddress() { return window._selectedAddress || ''; }
    function getSelectedLat()     { return window._selectedLat     || 0; }
    function getSelectedLng()     { return window._selectedLng     || 0; }
    function isConfirmed()        { return window._confirmed === true; }

    /* ════════════════════════════════════════════════
       HELPERS
    ════════════════════════════════════════════════ */
    function showOv(m) {
        document.getElementById('omsg').textContent = m;
        document.getElementById('ov').classList.remove('h');
    }
    function hideOv() { document.getElementById('ov').classList.add('h'); }
    function esc(s) {
        return String(s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    /* ════════════════════════════════════════════════
       DÉMARRAGE
    ════════════════════════════════════════════════ */
    window.addEventListener('load', function() {
        initMap();
    });
</script>
